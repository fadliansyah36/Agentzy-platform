name: Agentzy Minimum Engineering Checks

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'supabase/migrations/**'
      - '.github/workflows/agentzy-minimum-engineering.yml'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  minimum-engineering:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: development
      SUPABASE_URL: https://example.supabase.co
      DATABASE_URL: postgresql://agentzy:agentzy@127.0.0.1:5432/agentzy
      PYTHONPATH: apps/api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Frontend lint
        run: bun run lint

      - name: Frontend type check
        run: bunx tsc --noEmit

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install API engineering dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "fastapi>=0.115,<1" "uvicorn[standard]>=0.30,<1" "pydantic-settings>=2.5,<3" "sqlalchemy[asyncio]>=2,<3" "asyncpg>=0.29,<1" "PyJWT[crypto]>=2.9,<3" "httpx>=0.27,<1" "structlog>=24.4,<26" "cryptography>=43,<47" "python-multipart>=0.0.9,<1" "ruff>=0.8,<1" "pytest>=8,<9"

      - name: Python compile
        run: python -m compileall -q apps/api/app

      - name: Ruff
        run: ruff check --select E4,E7,E9,F --ignore E501 apps/api/app

      - name: Focused deterministic API checks
        run: pytest apps/api/tests -q

      - name: FastAPI import and OpenAPI contract
        run: |
          python - <<'PY'
          from app.main import app
          schema = app.openapi()
          paths = schema["paths"]
          assert "/api/v1/corporate/contracts" in paths
          assert "/api/v1/integrations/google/oauth/start" in paths
          assert "/api/v1/public/catalogue" in paths
          assert "/api/v1/corporate/provider-profiles" in paths
          assert "/api/v1/corporate/ai-workers" in paths
          assert "/api/v1/corporate/contracts/{contract_id}/versions" in paths
          assert "/api/v1/corporate/contracts/{contract_id}/activate" in paths
          assert "/api/v1/corporate/contracts/{contract_id}/suspend" in paths
          assert "/api/v1/corporate/contracts/{contract_id}/terminate" in paths
          assert "/api/v1/corporate/payment-references/{reference_id}/verify" in paths
          assert "/api/v1/corporate/metrics/contracts" in paths
          assert "/api/v1/workforce/register" in paths
          assert "/api/v1/workforce/passport" in paths
          assert "/api/v1/workforce/profiles/{profile_id}/identity" in paths
          assert "/api/v1/workforce/identity/{verification_id}/decision" in paths
          assert "/api/v1/workforce/identity/{verification_id}/upload" in paths
          assert "/api/v1/workforce/profiles/{profile_id}/engagements" in paths
          assert "/api/v1/workforce/profiles/{profile_id}/skills" in paths
          assert "/api/v1/workforce/profiles/{profile_id}/certifications" in paths
          assert "/api/v1/workforce/profiles/{profile_id}/availability" in paths
          assert "/api/v1/workforce/availability/{availability_id}/cancel" in paths
          assert "/api/v1/workforce/training/courses" in paths
          assert "/api/v1/workforce/profiles/{profile_id}/training/enroll" in paths
          assert "/api/v1/workforce/profiles/{profile_id}/onboarding" in paths
          assert "/api/v1/workforce/profiles/{profile_id}/lifecycle" in paths
          assert "/api/v1/workforce/profiles/{profile_id}/assignments" in paths
          assert "/api/v1/workforce/documents/retention/purge" in paths
          assert "/api/v1/sales/dashboard" in paths
          assert "/api/v1/sales/leads" in paths
          assert "/api/v1/sales/providers" in paths
          assert "/api/v1/sales/providers/{provider_id}/status" in paths
          assert "/api/v1/sales/catalogue" in paths
          assert "/api/v1/sales/orders" in paths
          assert "/api/v1/sales/webhooks/providers/{provider_code}" in paths
          assert "/api/v1/sales/reconciliation" in paths
          print(f"OpenAPI paths: {len(paths)}")
          PY

      - name: Migration source consistency
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          files = sorted(Path("supabase/migrations").glob("*.sql"))
          versions = [re.match(r"^(\d{14})_", item.name).group(1) for item in files]
          assert len(versions) == len(set(versions)), "Duplicate migration version"
          assert all(re.match(r"^\d{14}_[a-z0-9_]+\.sql$", item.name) for item in files)
          print(f"Migration sources: {len(files)}")
          PY
